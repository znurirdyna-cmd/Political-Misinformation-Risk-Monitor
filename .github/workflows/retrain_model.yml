
name: Retrain Misinformation Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain without social features
        run: |
          python scripts/train_model.py --model "Logistic Regression" --no-social

      - name: Upload trained model for review
        uses: actions/upload-artifact@v4
        with:
          name: retrained-misinformation-model
          path: |
            models/pipeline.joblib
            models/metadata.json
            models/metrics.json
